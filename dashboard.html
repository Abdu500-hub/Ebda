
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | IBDA TEAM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2ecca4; --bg: #0d1117; --card: #161b22; --text: #c9d1d9; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .header-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 5%; margin-bottom: 30px; border-bottom: 1px solid #30363d; }
        .user-greeting { font-size: 1.2rem; color: white; }
        .logout-btn { color: #ff7b72; text-decoration: none; border: 1px solid #30363d; padding: 5px 15px; border-radius: 6px; transition: 0.3s; }
        .logout-btn:hover { background: #ff7b72; color: white; }
        
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
        .stat-card { background: var(--card); border: 1px solid #30363d; border-radius: 12px; padding: 25px; position: relative; overflow: hidden; }
        .stat-card::after { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
        
        .course-card { background: #21262d; border-radius: 10px; padding: 15px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-view { background: var(--primary); color: #0d1117; padding: 8px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header class="header-nav">
        <div class="user-greeting">Hello, <span id="userNameHeader" style="color: var(--primary); font-weight: bold;">User</span> 👋</div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <a href="cors.html" style="color: white; text-decoration: none;">Courses</a>
            <a href="#" onclick="logoutUser()" class="logout-btn">Logout</a>
        </div>
    </header>

    <div class="dash-grid">
        <div class="stat-card">
            <h3 style="margin-top:0"><i class="fas fa-id-badge"></i> Student Profile</h3>
            <p>Plan: <span id="userPlan" style="color: var(--primary);">...</span></p>
            <p>Joined: <span id="joinDateText">...</span></p>
        </div>

        <div class="stat-card" style="grid-column: span 1;">
            <h3><i class="fas fa-play-circle"></i> My Courses</h3>
            <div id="coursesItems">
                <p style="font-size: 0.8rem; color: #8b949e;">Active subscriptions will appear here.</p>
            </div>
        </div>
    </div>
    <button class="ibda-btn" onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLScQhWTfK6ZO15qA4_7-Ub4yT9OhwWYyz9eKY8aSPRajX2esnA/viewform?usp=publish-editor', '_blank')">
    <span class="icon">📁</span>
    تسليم الواجب الآن
    <span class="badge">Google Form</span>
</button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = JSON.parse(localStorage.getItem('studentInfo'));
            if (data) {
                document.getElementById('userNameHeader').innerText = data.name.split(' ')[0];
                document.getElementById('userPlan').innerText = data.plan || "Free Tier";
                document.getElementById('joinDateText').innerText = data.joinDate || "N/A";

                if (data.courses && data.courses.length > 0) {
                    document.getElementById('coursesItems').innerHTML = data.courses.map(c => `
                        <div class="course-card">
                            <span>${c}</span>
                            <a href="Courses hub.html" class="btn-view">Watch Now</a>
                        </div>
                    `).join('');
                }
            }
        });
        function logoutUser() { localStorage.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
