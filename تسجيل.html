 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | EBDA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* === CSS: ستايل إبدا المطور === */
        :root {
            --main-color: #86ff7b;
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #222;
            border: none;
            color: #888;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--main-color);
            color: black;
            font-weight: bold;
        }

        .input-group { margin-bottom: 15px; }

        input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
        }

        .main-btn {
            width: 100%;
            padding: 15px;
            background: var(--main-color);
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .back-home {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--main-color);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>

    <div class="login-card">
        <div class="tabs">
            <button id="tab-login" class="tab-btn active">تسجيل دخول</button>
            <button id="tab-register" class="tab-btn">إنشاء حساب</button>
        </div>

        <h2 id="form-title" style="text-align: center;">مرحباً بك في <span style="color: var(--main-color);">EBDA</span></h2>
        
        <form id="auth-form">
            <div id="name-field" class="input-group" style="display: none;">
                <input type="text" id="u-name" placeholder="الاسم بالكامل">
            </div>
            <div class="input-group">
                <input type="email" id="u-email" placeholder="البريد الإلكتروني" required>
            </div>
            <div class="input-group">
                <input type="password" id="u-pass" placeholder="كلمة السر" required>
            </div>
            <button type="submit" id="submit-btn" class="main-btn">دخول</button>
        </form>
    </div>

    <script type="module">
        // استدعاء فايربيز (تأكد من وضع إعداداتك هنا)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ضع بيانات مشروعك هنا (Firebase Config)
        const firebaseConfig = {
            apiKey: "AIza...",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isLoginMode = true;

        // تبديل الأشكال (Tabs)
        document.getElementById('tab-login').onclick = () => {
            isLoginMode = true;
            document.getElementById('name-field').style.display = 'none';
            document.getElementById('tab-login').classList.add('active');
            document.getElementById('tab-register').classList.remove('active');
            document.getElementById('submit-btn').innerText = 'دخول';
        };

        document.getElementById('tab-register').onclick = () => {
            isLoginMode = false;
            document.getElementById('name-field').style.display = 'block';
            document.getElementById('tab-register').classList.add('active');
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('submit-btn').innerText = 'إنشاء الحساب';
        };

        // تنفيذ العملية
        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('u-email').value;
            const pass = document.getElementById('u-pass').value;

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, pass);
                    alert("أهلاً بك مجدداً!");
                    window.location.href = "dashboard.html";
                } else {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    alert("تم إنشاء حسابك بنجاح!");
                    window.location.href = "dashboard.html";
                }
            } catch (error) {
                alert("خطأ: " + error.message);
            }
        };
    </script>
</body>
</html>
