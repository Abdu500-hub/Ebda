
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبارات كورس الإنترنت | EBDA</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #05070a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .quiz-page { max-width: 900px; margin: 80px auto; padding: 20px; }
        .station-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        
        .station-card {
            background: #0a0c10;
            border: 1px solid rgba(134, 255, 123, 0.1);
            border-radius: 20px;
            padding: 25px;
            position: relative;
            transition: 0.4s;
            cursor: pointer;
            overflow: hidden;
        }
        .station-card:hover {
            border-color: #86ff7b;
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(134, 255, 123, 0.05);
        }
        .station-number {
            position: absolute;
            top: -10px;
            left: -10px;
            font-size: 5rem;
            font-weight: 900;
            color: rgba(134, 255, 123, 0.03);
            z-index: 0;
        }
        .station-card h3 { color: #86ff7b; margin-bottom: 10px; position: relative; }
        .station-card p { color: #888; font-size: 0.9rem; line-height: 1.6; }
        
        /* نظام النافذة المنبثقة للاختبار */
        #quiz-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #0f1217;
            padding: 40px;
            border-radius: 25px;
            max-width: 600px;
            width: 90%;
            border: 1px solid #86ff7b;
            text-align: center;
        }
        .option-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #1a1e24;
            border: 1px solid #333;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .option-btn:hover { background: #86ff7b; color: #000; }
    </style>
</head>
<body>
<header>
    <div class="quiz-header" style="display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #0a0c10; border-bottom: 1px solid #86ff7b;">
    <div class="user-rank">
        <i class="fas fa-trophy" style="color: #ffd700; font-size: 1.5rem;"></i>
        <span id="total-points" style="font-size: 1.2rem; font-weight: bold; margin-right: 10px;">0</span>
        <span style="color: #888;">نقطة</span>
    </div>
    <div class="course-title">كورس أساسيات الشبكات</div>
</div>

<div class="station-grid">
    <div class="station-card" onclick="openQuiz(0)"><h3>1. ماهية الإنترنت</h3></div>
    <div class="station-card" onclick="openQuiz(1)"><h3>2. عناوين الـ IP</h3></div>
    <div class="station-card" onclick="openQuiz(2)"><h3>3. الـ DNS والخوادم</h3></div>
    <div class="station-card" onclick="openQuiz(3)"><h3>4. أنواع الشبكات (LAN/WAN)</h3></div>
    <div class="station-card" onclick="openQuiz(4)"><h3>5. أمن الشبكات</h3></div>
</div>

<div id="result-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:3000; justify-content:center; align-items:center;">
    <div class="modal-content" style="text-align:center; border: 2px solid #86ff7b;">
        <i class="fas fa-award" style="font-size: 5rem; color: #86ff7b;"></i>
        <h2 style="margin-top:20px;">انتهى الاختبار!</h2>
        <p id="final-score-text" style="font-size: 1.5rem; margin: 20px 0;"></p>
        <button onclick="location.reload()" class="option-btn" style="background:#86ff7b; color:#000;">العودة للمحطات</button>
    </div>
</div>
</header>
    <script src="js.js" type="module"></script>
</body>
</html>
