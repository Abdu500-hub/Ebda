
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استفتاء الانضمام | EBDA TEAM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --card: rgba(30, 31, 32, 0.85);
            --primary: #86ff7b;
            --text: #e3e3e3;
            --border: rgba(134, 255, 123, 0.2);
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, rgba(134, 255, 123, 0.05) 0%, transparent 80%);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .survey-card {
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .rocket-icon { font-size: 3.5rem; color: var(--primary); margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--primary)); }
        
        h2 { margin: 10px 0; font-size: 1.8rem; }
        p { color: #888; margin-bottom: 30px; font-size: 0.95rem; }

        .input-group { text-align: right; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--primary); font-size: 0.9rem; }

        select, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #3c4043;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        .finish-btn {
            width: 100%;
            background: var(--primary);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            transition: 0.4s;
        }

        .finish-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(134, 255, 123, 0.3); }
        .finish-btn:disabled { background: #444; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="survey-card">
    <i class="fas fa-rocket rocket-icon"></i>
    <h2>تحليل المستوى..</h2>
    <p>لحظات وهتكون جزء من فريق إبداع!</p>

    <div class="input-group">
        <label>مستواك التقني الحالي؟</label>
        <select id="pc-level">
            <option value="1">مبتدئ تماماً</option>
            <option value="2">متوسط</option>
            <option value="3">متقدم</option>
        </select>
    </div>

    <div class="input-group">
        <label>هدف شخصي تحب تحققه؟</label>
        <textarea id="goal" placeholder="مثلاً: أعمل أول موقع ليا.."></textarea>
    </div>
<button type="button" onclick="confirmCourseSubscription()" class="submit-survey-btn">
    إرسال الاستفتاء وإتمام الاشتراك 🚀
</button>
</div>

<script type="module">
    import { doc, updateDoc, arrayUnion, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { db } from './js.js'; 

    window.confirmCourseSubscription = async function() {
        const userData = JSON.parse(localStorage.getItem('studentInfo'));
        const pendingCourse = localStorage.getItem('pendingCourse');

        if (!userData || !pendingCourse) {
            window.location.href = 'cors.html';
            return;
        }

        try {
            // 1. تسجيل الاشتراك في جدول enrollments (عشان الزرار يقلب رمادي)
            await addDoc(collection(db, "enrollments"), {
                studentEmail: userData.email,
                courseName: pendingCourse,
                date: new Date().toISOString()
            });

            // 2. تحديث بيانات الطالب نفسه
            const studentRef = doc(db, "students", userData.uid);
            await updateDoc(studentRef, {
                plan: pendingCourse,
                courses: arrayUnion(pendingCourse)
            });

            // 3. تحديث التخزين المحلي
            userData.plan = pendingCourse;
            userData.courses = userData.courses || [];
            userData.courses.push(pendingCourse);
            localStorage.setItem('studentInfo', JSON.stringify(userData));

            alert("تم الاشتراك بنجاح! جاري تحويلك للكورسات...");
            window.location.href = 'cors.html'; 
        } catch (e) {
            console.error("Error:", e);
            alert("حدث خطأ، تأكد من اتصالك بالإنترنت");
        }
    };
</script>
</body>
</html>
