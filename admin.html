<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم الاحترافية | EBDA Admin</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-container { padding: 40px; max-width: 1200px; margin: auto; }
        
        /* كروت الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-box h3 { color: var(--primary); font-size: 2rem; margin-bottom: 5px; }

        /* شريط البحث */
        .search-area {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: white;
            outline: none;
        }

        /* الجدول */
        .admin-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 15px; overflow: hidden; }
        .admin-table th, .admin-table td { padding: 15px; text-align: right; border-bottom: 1px solid var(--border); }
        .admin-table th { background: rgba(0, 210, 255, 0.1); color: var(--primary); }
        
        .student-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        
        /* الأزرار */
        .action-btn {
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: 0.3s;
            margin-left: 5px;
        }
        .whatsapp-btn { background: #25d366; color: white; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; height: 35px; width: 35px; border-radius: 50%; }
        .activate-btn { background: var(--primary); color: #000; }
        .activate-btn:disabled { background: #333; color: #777; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>لوحة تحكم الإدارة 🛡️</h1>

        <div class="stats-grid">
            <div class="stat-box">
                <p>إجمالي الطلاب</p>
                <h3 id="total-students">0</h3>
            </div>
            <div class="stat-box">
                <p>مشتركين HTML</p>
                <h3 id="pro-students" style="color: #22c55e;">0</h3>
            </div>
        </div>

        <div class="search-area">
            <input type="text" id="admin-search" class="search-input" placeholder="ابحث باسم الطالب أو رقم الهاتف...">
        </div>

        <table class="admin-table">
            <thead>
                <tr>
                    <th>الطالب</th>
                    <th>رقم الهاتف</th>
                    <th>الباقة</th>
                    <th>تاريخ الانضمام</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="students-list">
                </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLMAil66B9IDXJE4w4IR36Gxu0IEKaJ-o",
            authDomain: "eee1-95ee9.firebaseapp.com",
            projectId: "eee1-95ee9",
            storageBucket: "eee1-95ee9.firebasestorage.app",
            messagingSenderId: "342455666250",
            appId: "1:342455666250:web:f37becaa0589095db088b3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allStudents = [];

        // 1. تحديث باقة الطالب يدوياً
        window.upgradeStudent = async (phone) => {
            if(confirm("هل تريد تفعيل باقة HTML لهذا الطالب؟")) {
                await updateDoc(doc(db, "students", phone), { plan: "HTML Course" });
                alert("تم التفعيل بنجاح!");
            }
        };

        // 2. الاستماع للبيانات (Real-time)
        onSnapshot(collection(db, "students"), (snapshot) => {
            allStudents = snapshot.docs.map(doc => doc.data());
            updateDashboard(allStudents);
        });

        // 3. دالة تحديث واجهة المستخدم
        function updateDashboard(data) {
            const listBody = document.getElementById('students-list');
            listBody.innerHTML = "";

            let proCount = 0;

            data.forEach(s => {
                if(s.plan === "HTML Course") proCount++;

                const row = `
                    <tr>
                        <td style="display:flex; align-items:center; gap:10px;">
                            <img src="${s.profileImage || 'profile-placeholder.png'}" class="student-img">
                            <span>${s.name}</span>
                        </td>
                        <td>${s.phone}</td>
                        <td><b style="color:${s.plan === 'Free Tier' ? '#aaa' : '#22c55e'}">${s.plan}</b></td>
                        <td>${s.createdAt || '---'}</td>
                        <td>
                            <a href="https://wa.me/2${s.phone}" target="_blank" class="whatsapp-btn"><i class="fab fa-whatsapp"></i></a>
                            <button class="action-btn activate-btn" 
                                onclick="upgradeStudent('${s.phone}')" 
                                ${s.plan === 'HTML Course' ? 'disabled' : ''}>
                                تفعيل الكورس
                            </button>
                        </td>
                    </tr>
                `;
                listBody.innerHTML += row;
            });

            document.getElementById('total-students').innerText = data.length;
            document.getElementById('pro-students').innerText = proCount;
        }

        // 4. نظام البحث الفوري
        document.getElementById('admin-search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allStudents.filter(s => 
                s.name.toLowerCase().includes(term) || s.phone.includes(term)
            );
            updateDashboard(filtered);
        });
    </script>
</body>
</html>
