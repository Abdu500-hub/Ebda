
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إبداع تيم IDE | Dashboard Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.11/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.11/theme/dracula.min.css">
    <style>
        :root { --bg: #0d1117; --side: #161b22; --accent: #86ff7b; --border: #30363d; --text: #c9d1d9; }
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
        
        header { height: 55px; background: var(--side); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); }
        .logo { font-weight: bold; color: var(--accent); font-size: 1.2rem; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 280px; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .panel-header { padding: 15px; font-size: 11px; color: #8b949e; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        
        .file-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        /* تنسيق الملفات المرفوعة والافتراضية */
        .file-item {
            background: #1a1f26;
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .file-item:hover { background: #21262d; border-color: var(--accent); }
        .file-item.active { border-left: 3px solid var(--accent); background: #1f2937; }

        .file-icon { width: 20px; height: 20px; margin-right: 10px; object-fit: contain; }
        .file-info { flex: 1; display: flex; justify-content: space-between; align-items: center; overflow: hidden; }
        .file-name { color: white; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* أزرار الحذف والتحميل */
        .file-actions { display: flex; gap: 8px; align-items: center; }
        .remove-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }
        .remove-btn:hover { background: #cc0000; transform: scale(1.1); }
        
        .download-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 11px;
            border: 1px solid var(--accent);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .tasks-section { padding: 15px; border-top: 1px solid var(--border); background: #090c10; }
        .tasks-section select { width: 100%; background: #21262d; color: #fff; border: 1px solid var(--border); padding: 8px; border-radius: 5px; margin-bottom: 10px; }
        #taskStatus { font-size: 12px; color: #8b949e; text-align: center; padding: 10px; border: 1px dashed #444; border-radius: 5px; }

        .editor-zone { flex: 1; display: flex; flex-direction: column; }
        .CodeMirror { flex: 1; font-size: 16px; }
        .preview-zone { height: 35%; background: #fff; border-top: 5px solid var(--border); }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">EBDA <span style="color:white">EDITOR</span></div>
    <div style="font-size: 12px; color: var(--accent); font-weight: bold;">Dashboard Mode</div>
</header>

<div class="main-layout">
    <div class="sidebar">
        <div class="panel-header">
            EXPLORER 
            <div class="header-tools">
                <i class="fas fa-file-upload" style="color: var(--accent); cursor: pointer; font-size: 16px; margin-right: 10px;" title="رفع ملف" onclick="document.getElementById('fileUploadInput').click()"></i>
                <i class="fas fa-plus-circle" style="color: #2ea043; cursor: pointer; font-size: 16px;" title="إضافة ملف جديد" onclick="createNewFile()"></i>
            </div>
            <input type="file" id="fileUploadInput" style="display: none;" onchange="handleFileUpload(this)" multiple>
        </div>
        
        <div id="fileList" class="file-list">
            </div>

        <div class="panel-header">المهام والدروس</div>
        <div class="tasks-section">
            <select id="langFilter" onchange="updateTaskStatus()">
                <option value="">اختر اللغة...</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="js">JavaScript</option>
            </select>
            <div id="taskStatus">يرجى اختيار لغة لعرض المهام</div>
        </div>
    </div>

    <div class="editor-zone">
        <textarea id="editor"></textarea>
        <div class="preview-zone">
            <iframe id="livePreview"></iframe>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.11/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.11/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.11/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.11/mode/javascript/javascript.min.js"></script>

<script>
    // تخزين محتوى الملفات
    let files = {
        "index.html": { content: "\n<h1>مرحباً بك في إبداع!</h1>", mode: "text/html" },
        "style.css": { content: "h1 { color: #86ff7b; text-align: center; }", mode: "css" }
    };
    
    let activeFile = "index.html";

    const editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
        lineNumbers: true, theme: "dracula", mode: "text/html",
        autoCloseTags: true, autoCloseBrackets: true
    });

    editor.on("change", () => {
        if(files[activeFile]) {
            files[activeFile].content = editor.getValue();
            renderPreview();
        }
    });

    function renderPreview() {
        const preview = document.getElementById("livePreview").contentWindow.document;
        let html = files["index.html"] ? files["index.html"].content : "";
        let css = "";
        for (let f in files) { if (f.endsWith(".css")) css += `<style>${files[f].content}</style>`; }
        preview.open();
        preview.write(css + html);
        preview.close();
    }

    function renderFileList() {
        const list = document.getElementById("fileList");
        list.innerHTML = "";
        
        for (let fileName in files) {
            const extension = fileName.split('.').pop().toLowerCase();
            const div = document.createElement("div");
            div.className = `file-item ${fileName === activeFile ? 'active' : ''}`;
            
            // نظام الأيقونات الذكي
            const icons = {
                'py': 'https://cdn-icons-png.flaticon.com/512/5968/5968350.png',
                'java': 'https://cdn-icons-png.flaticon.com/512/226/226777.png',
                'cs': 'https://cdn-icons-png.flaticon.com/512/6132/6132221.png',
                'js': 'https://cdn-icons-png.flaticon.com/512/5968/5968292.png',
                'html': 'https://cdn-icons-png.flaticon.com/512/1051/1051277.png',
                'css': 'https://cdn-icons-png.flaticon.com/512/732/732190.png'
            };
            const iconUrl = icons[extension] || 'https://cdn-icons-png.flaticon.com/512/124/124837.png';

            div.innerHTML = `
                <img src="${iconUrl}" class="file-icon">
                <div class="file-info" onclick="switchFile('${fileName}')">
                    <span class="file-name">${fileName}</span>
                </div>
                <div class="file-actions">
                    <button class="remove-btn" onclick="removeThisFile('${fileName}', event)">×</button>
                </div>
            `;
            list.appendChild(div);
        }
    }

    function handleFileUpload(input) {
        const uploadedFiles = input.files;
        for (let file of uploadedFiles) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const name = file.name;
                const mode = name.endsWith(".css") ? "css" : (name.endsWith(".js") ? "javascript" : "text/html");
                files[name] = { content: e.target.result, mode: mode };
                renderFileList();
                switchFile(name);
            };
            reader.readAsText(file);
        }
    }

    function switchFile(name) {
        activeFile = name;
        editor.setOption("mode", files[name].mode);
        editor.setValue(files[name].content);
        renderFileList();
    }

    function removeThisFile(name, event) {
        event.stopPropagation();
        if (Object.keys(files).length > 1) {
            delete files[name];
            if (activeFile === name) {
                activeFile = Object.keys(files)[0];
            }
            renderFileList();
            switchFile(activeFile);
            renderPreview();
        } else {
            alert("لا يمكنك حذف آخر ملف!");
        }
    }

    function createNewFile() {
        let name = prompt("اسم الملف (مثال: script.js):");
        if (name && !files[name]) {
            let mode = name.endsWith(".css") ? "css" : (name.endsWith(".js") ? "javascript" : "text/html");
            files[name] = { content: "", mode: mode };
            switchFile(name);
        }
    }

    function updateTaskStatus() {
        const val = document.getElementById("langFilter").value;
        const status = document.getElementById("taskStatus");
        status.innerText = val === "" ? "يرجى اختيار لغة لعرض المهام" : "⚠️ لم يتم إضافة تحديات لهذه اللغة بعد.";
        status.style.color = val === "" ? "#8b949e" : "#f1e05a";
    }

    // التشغيل المبدئي
    renderFileList();
    editor.setValue(files[activeFile].content);
    renderPreview();
</script>
</body>
</html>
